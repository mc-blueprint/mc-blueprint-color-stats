name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: colorstats
          POSTGRES_PASSWORD: colorstats_ci
          POSTGRES_DB: colorstats_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colorstats -d colorstats_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://colorstats:colorstats_ci@localhost:5432/colorstats_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
