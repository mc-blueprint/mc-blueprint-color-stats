# 全体1万枚のうちCommonsは80%の8,000枚まで。既存画像を含む。
taxonomy_version: 0.1.0
image_budget: 10000
# subjectsは統計の目標比率、imagesは既存を含む収集上限。集中枠は維持する。
gap_plan:
  issue: 105
  evidence: bench/issue105/results.md
  deficits: bench/issue105/deficits-after.json
  priority_order: ascending
  provider_issues: {library_of_congress: 92, mapillary: 94}
limits:
  subject_images: 3
  subject_share: 0.003
  author_share: 0.05
  source_share: 0.8
  region_share: 0.4
search:
  providers: [wikimedia_commons]
  pages: 3
  limit: 10
  max_offset: 500
strata:
  - id: japanese-castle
    priority: 2
    collection_sources: [wikimedia_commons, mapillary]
    focus_parts: [wall, roof, window, door]
    attributes:
      domain: real_building
      style: japanese
      building_type: castle
      region: japan
      era: early_modern
    subjects: 100
    images: 800
    queries:
      ja: [日本 城 天守, 日本 城 石垣, 城郭 櫓, 山城 城跡]
      en: [Japanese castle exterior, Japanese castle walls, Japanese castle keep, Japanese castle gate]
