# 公式確認日: 2026-11-01。数値は公式の固定上限ではなく本プロジェクトの制限。
sources:
  wikimedia_commons:
    enabled: true
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    maxlag: 5
    retries: 2
    backoff: 5.0
    attribution: "指定帰属（なければ作者・Credit）、出典ページ、ライセンス名・URL、改変の有無をprovenanceへ記載"
    redistribution: "openのみライセンス条件を満たして可。配布パックには画像を含めない"
    license_rules:
      analysis_only:
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
      open:
        - cc0
        - pd
        - cc-by-1.0
        - cc-by-2.0
        - cc-by-2.5
        - cc-by-3.0
        - cc-by-4.0
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
    rights_basis: copyright_act_30_4
    attribution_required: false
    access_scope: internal
    image_redistribution: false
    retention: {raw_days: 30, rejected_days: 7, deletion_request_days: 7, backup_days: 30}
    rights_review:
      reviewed_at: "2026-11-05T00:00:00+00:00"
      terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      api_url: https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_Robot_policy
      robots_url: https://commons.wikimedia.org/robots.txt
      summary: "Issue #104のユーザー判断。非表現的な色統計の内部解析に限定し、原画像・原metaは配布しない。Action APIは認証なし同時1・5 req/s未満、1秒超の要求後は5秒待つ。robots.txtのDisallow /w/は動的ページ巡回向けと解釈しAction APIの公式規定に従う。保持期限は新規収集分だけに適用し、既存アーカイブには設定しない。外部再照会は行わずIssueの確認済み判断を記録。"
      purpose: non_expressive_color_statistics
      decision: allowed
      reviewer: user (Issue 104, 2026-11-05)
      policy_version: issue104-v1
    references:
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_API_Usage_Guidelines
      - https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy
      - https://www.mediawiki.org/wiki/API:Etiquette
      - https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
  openverse:
    enabled: true
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    retries: 2
    backoff: 5.0
    attribution: "作者・元サイトページ・ライセンス名・ライセンスURLを保存し、元サイトの対象画像で作者とライセンス識別子・版・URLを照合できない候補はreviewとして取得しない"
    redistribution: "open のみ。Openverse の集約情報を元サイトで照合し、元サイトの利用条件を優先する"
    license_rules:
      open:
        - cc0
        - pdm
        - by
        - by-sa
    references:
      - https://api.openverse.org/v1/
      - https://docs.openverse.org/api/reference/made_with_ov.html
      - https://docs.openverse.org/api/reference/authentication_and_throttling.html
      - https://github.com/WordPress/openverse/blob/main/documentation/terms_of_service.md
