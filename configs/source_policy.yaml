# 公式確認日: 2026-11-01。数値は公式の固定上限ではなく本プロジェクトの制限。
sources:
  mapillary:
    enabled: false
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    credential: mapillary-client-token
    min_interval: 2.0
    retries: 0
    backoff: 60.0
    hosts:
      graph.mapillary.com:
        kind: api
        min_interval: 2.0
        max_concurrency: 1
        api_windows: [{seconds: 60, limit: 30}]
      fbcdn.net:
        kind: media
        rate_group: mapillary-media
        min_interval: 2.0
        max_concurrency: 1
        media_bytes_per_10_seconds: 5000000
    media_hosts: [fbcdn.net]
    searches:
      kyoto-street-buildings:
        intent: 京都の道路沿い建築の色解析候補（建築分類は未確認）
        region: japan-kyoto
        bbox: [135.768, 35.003, 135.773, 35.008]
    attribution: 作者ID・画像ページ・CC BY-SA 4.0を内部台帳へ保存
    redistribution: 原画像・縮小画像・CVAT・個人情報を配布せず非表現的統計だけを使用
    license_rules:
      analysis_only: [cc-by-sa-4.0]
    rights_basis: copyright_act_30_4
    attribution_required: false
    access_scope: internal
    image_redistribution: false
    retention: {raw_days: 30, rejected_days: 7, deletion_request_days: 7, backup_days: 30}
    rights_review:
      reviewed_at: "2026-11-05T09:00:00+00:00"
      terms_url: https://www.mapillary.com/terms
      api_url: https://www.mapillary.com/developer/api-documentation
      robots_url: https://graph.mapillary.com/robots.txt
      summary: "Issue 94のユーザー確認済み2024-02-15発効規約§3(b)・5・11・12。登録アプリの公開APIのみ、単純再配布・画像配信・再識別・ぼかし解除は禁止。大量本収集は105完了後に別途実行。保持は承認済み30日、削除窓口はdocs/retention.md。"
      purpose: non_expressive_color_statistics
      decision: allowed
      reviewer: user (Issue 94 comments, 2026-11-05)
      policy_version: issue94-v1
      robots_status: "2026-11-05実確認: User-agent * / Disallow /。公開APIとの適用関係の判断待ち、有効化禁止"
    references:
      - https://github.com/mapillary/mapillary-python-sdk/blob/main/src/mapillary/config/api/entities.py
      - https://github.com/mapillary/mapillary-python-sdk/blob/main/src/mapillary/models/client.py
  wikimedia_commons:
    enabled: true
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    api_min_interval: 0.5
    api_slow_seconds: 5.0
    api_windows:
      - {seconds: 60, limit: 199}
    media_bytes_per_10_seconds: 31250000
    hosts:
      commons.wikimedia.org:
        kind: api
        min_interval: 0.5
        api_windows: [{seconds: 60, limit: 199}]
      upload.wikimedia.org:
        kind: media
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      thumb.wikimedia.org:
        kind: media
        rate_group: upload.wikimedia.org
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      www.wikidata.org:
        kind: api
        min_interval: 0.5
        api_windows: [{seconds: 60, limit: 199}]
    maxlag: 5
    retries: 2
    backoff: 5.0
    attribution: "指定帰属（なければ作者・Credit）、出典ページ、ライセンス名・URL、改変の有無をprovenanceへ記載"
    redistribution: "openのみライセンス条件を満たして可。配布パックには画像を含めない"
    license_rules:
      analysis_only:
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
      open:
        - cc0
        - pd
        - cc-by-1.0
        - cc-by-2.0
        - cc-by-2.5
        - cc-by-3.0
        - cc-by-4.0
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
    rights_basis: copyright_act_30_4
    attribution_required: false
    access_scope: internal
    image_redistribution: false
    retention: {raw_days: 30, rejected_days: 7, deletion_request_days: 7, backup_days: 30}
    rights_review:
      reviewed_at: "2026-11-05T08:37:41.631340+00:00"
      terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      api_url: https://wikitech.wikimedia.org/wiki/Robot_policy#Action_API_rules
      rate_limits_url: https://www.mediawiki.org/wiki/Wikimedia_APIs/Rate_limits
      robots_url: https://commons.wikimedia.org/robots.txt
      summary: "2026-11-05のユーザー判断。Robot policy自身が/w/api.phpを例示したAction API rules節で、未認証の同時1・5 req/s未満・1秒超の要求後5秒待機を定めていることを根拠として、robots.txtのDisallow /w/を踏まえてAction API利用を継続する。レートの一次情報も同日確認。非表現的な色統計の内部解析に限定し、原画像・原metaは配布しない。保持期限は新規収集分だけに適用し、既存アーカイブには設定しない。"
      purpose: non_expressive_color_statistics
      decision: allowed
      reviewer: user (Issue 104, 2026-11-05)
      policy_version: issue104-v2
    references:
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_API_Usage_Guidelines
      - https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy
      - https://www.mediawiki.org/wiki/API:Etiquette
      - https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
  openverse:
    enabled: true
    auth_mode: anonymous
    credentials: [openverse-client-id, openverse-client-secret]
    standard_api_windows: [{seconds: 60, limit: 100}, {seconds: 86400, limit: 10000}]
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    api_windows:
      - {seconds: 3600, limit: 5}
      - {seconds: 86400, limit: 100}
    hosts:
      api.openverse.org:
        kind: api
        min_interval: 1.0
        api_windows: [{seconds: 3600, limit: 5}, {seconds: 86400, limit: 100}]
      openverse.org: {kind: page}
      flickr.com: {kind: page}
      staticflickr.com: {kind: media}
      upload.wikimedia.org:
        kind: media
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      thumb.wikimedia.org:
        kind: media
        rate_group: upload.wikimedia.org
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      wikimedia.org: {kind: page}
      loc.gov: {kind: page}
      images.mapillary.com: {kind: media}
      mapillary.com: {kind: page}
    retries: 2
    backoff: 5.0
    attribution: "作者・元サイトページ・ライセンス名・ライセンスURLを保存し、元サイトの対象画像で作者とライセンス識別子・版・URLを照合できない候補はreviewとして取得しない"
    redistribution: "open のみ。Openverse の集約情報を元サイトで照合し、元サイトの利用条件を優先する"
    license_rules:
      open:
        - cc0
        - pdm
        - by
        - by-sa
    references:
      - https://api.openverse.org/v1/
      - https://docs.openverse.org/api/reference/made_with_ov.html
      - https://docs.openverse.org/api/reference/authentication_and_throttling.html
      - https://github.com/WordPress/openverse/blob/main/documentation/terms_of_service.md
  loc:
    enabled: false
    endpoint_type: collection
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 6.0
    api_min_interval: 6.0
    api_windows: [{seconds: 60, limit: 10}]
    hosts:
      www.loc.gov:
        kind: api
        rate_group: loc.gov
        min_interval: 6.0
        api_windows: [{seconds: 60, limit: 10}]
      tile.loc.gov:
        kind: media
        rate_group: loc.gov
        min_interval: 6.0
      cdn.loc.gov:
        kind: media
        rate_group: loc.gov
        min_interval: 10.0
        disallow_paths: [/service, /master]
    retries: 0
    backoff: 5.0
    attribution: "LoCのitem別Rights and Access原文と出典URLを保持し、No known restrictionsをpublic domainへ変換しない"
    redistribution: "open区分のみ条件に従い許可。解析専用入力と画像は内部限定、配布物へ含めない"
    license_rules:
      open: [pd]
      analysis_only: [loc-analysis-only]
    rights_basis: copyright_act_30_4
    attribution_required: false
    access_scope: internal
    image_redistribution: false
    retention: {raw_days: 30, rejected_days: 7, deletion_request_days: 7, backup_days: 30}
    rights_review:
      reviewed_at: "2026-11-05T10:00:00+00:00"
      terms_url: https://www.loc.gov/legal/
      api_url: https://www.loc.gov/apis/json-and-yaml/working-within-limits/
      robots_url: https://www.loc.gov/robots.txt
      image_robots_url: https://tile.loc.gov/robots.txt
      cdn_robots_url: https://cdn.loc.gov/robots.txt
      summary: "公式JSON APIはCloudflare challenge (403/Cf-Mitigated: challenge)を返すためアダプターを無効化。challenge検出時は再試行せず停止し、回避しない。"
      purpose: non_expressive_color_statistics
      decision: allowed
      reviewer: user (Issue 92)
      policy_version: issue92-v2
    references:
      - https://www.loc.gov/apis/json-and-yaml/requests/
      - https://www.loc.gov/apis/json-and-yaml/working-within-limits/
      - https://www.loc.gov/legal/
      - https://www.loc.gov/legal/security-copyright-and-privacy/understanding-copyright/
      - https://www.loc.gov/robots.txt
      - https://tile.loc.gov/robots.txt
      - https://cdn.loc.gov/robots.txt
