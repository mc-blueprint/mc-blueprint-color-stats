# 公式確認日: 2026-11-01。数値は公式の固定上限ではなく本プロジェクトの制限。
sources:
  wikimedia_commons:
    enabled: true
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    api_min_interval: 0.5
    api_slow_seconds: 5.0
    api_windows:
      - {seconds: 60, limit: 199}
    media_bytes_per_10_seconds: 31250000
    hosts:
      commons.wikimedia.org:
        kind: api
        min_interval: 0.5
        api_windows: [{seconds: 60, limit: 199}]
      upload.wikimedia.org:
        kind: media
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      thumb.wikimedia.org:
        kind: media
        rate_group: upload.wikimedia.org
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      www.wikidata.org:
        kind: api
        min_interval: 0.5
        api_windows: [{seconds: 60, limit: 199}]
    maxlag: 5
    retries: 2
    backoff: 5.0
    attribution: "指定帰属（なければ作者・Credit）、出典ページ、ライセンス名・URL、改変の有無をprovenanceへ記載"
    redistribution: "openのみライセンス条件を満たして可。配布パックには画像を含めない"
    license_rules:
      analysis_only:
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
      open:
        - cc0
        - pd
        - cc-by-1.0
        - cc-by-2.0
        - cc-by-2.5
        - cc-by-3.0
        - cc-by-4.0
        - cc-by-sa-1.0
        - cc-by-sa-2.0
        - cc-by-sa-2.5
        - cc-by-sa-3.0
        - cc-by-sa-4.0
    rights_basis: copyright_act_30_4
    attribution_required: false
    access_scope: internal
    image_redistribution: false
    retention: {raw_days: 30, rejected_days: 7, deletion_request_days: 7, backup_days: 30}
    rights_review:
      reviewed_at: "2026-11-05T08:37:41.631340+00:00"
      terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      api_url: https://wikitech.wikimedia.org/wiki/Robot_policy#Action_API_rules
      rate_limits_url: https://www.mediawiki.org/wiki/Wikimedia_APIs/Rate_limits
      robots_url: https://commons.wikimedia.org/robots.txt
      summary: "2026-11-05のユーザー判断。Robot policy自身が/w/api.phpを例示したAction API rules節で、未認証の同時1・5 req/s未満・1秒超の要求後5秒待機を定めていることを根拠として、robots.txtのDisallow /w/を踏まえてAction API利用を継続する。レートの一次情報も同日確認。非表現的な色統計の内部解析に限定し、原画像・原metaは配布しない。保持期限は新規収集分だけに適用し、既存アーカイブには設定しない。"
      purpose: non_expressive_color_statistics
      decision: allowed
      reviewer: user (Issue 104, 2026-11-05)
      policy_version: issue104-v2
    references:
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_API_Usage_Guidelines
      - https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy
      - https://www.mediawiki.org/wiki/API:Etiquette
      - https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
  openverse:
    enabled: true
    user_agent: "mc-blueprint-color-stats-bot/0.1 (https://github.com/mc-blueprint/mc-blueprint-color-stats; https://github.com/mc-blueprint)"
    min_interval: 1.0
    api_windows:
      - {seconds: 3600, limit: 5}
      - {seconds: 86400, limit: 100}
    hosts:
      api.openverse.org:
        kind: api
        min_interval: 1.0
        api_windows: [{seconds: 3600, limit: 5}, {seconds: 86400, limit: 100}]
      openverse.org: {kind: page}
      flickr.com: {kind: page}
      staticflickr.com: {kind: media}
      upload.wikimedia.org:
        kind: media
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      thumb.wikimedia.org:
        kind: media
        rate_group: upload.wikimedia.org
        min_interval: 1.0
        max_concurrency: 2
        media_bytes_per_10_seconds: 31250000
        disallow_paths: [/archive/]
      wikimedia.org: {kind: page}
      loc.gov: {kind: page}
      images.mapillary.com: {kind: media}
      mapillary.com: {kind: page}
    retries: 2
    backoff: 5.0
    attribution: "作者・元サイトページ・ライセンス名・ライセンスURLを保存し、元サイトの対象画像で作者とライセンス識別子・版・URLを照合できない候補はreviewとして取得しない"
    redistribution: "open のみ。Openverse の集約情報を元サイトで照合し、元サイトの利用条件を優先する"
    license_rules:
      open:
        - cc0
        - pdm
        - by
        - by-sa
    references:
      - https://api.openverse.org/v1/
      - https://docs.openverse.org/api/reference/made_with_ov.html
      - https://docs.openverse.org/api/reference/authentication_and_throttling.html
      - https://github.com/WordPress/openverse/blob/main/documentation/terms_of_service.md
